<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F3ECF7">
<title>Lilac</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-50 -50 100 100'%3E%3Cg fill='%23B58FCF'%3E%3Cpath id='p' d='M0 -4C-10 -12 -14 -28 -3 -46C-1 -48 1 -48 3 -46C14 -28 10 -12 0 -4Z'/%3E%3Cuse href='%23p' transform='rotate(60)'/%3E%3Cuse href='%23p' transform='rotate(120)'/%3E%3Cuse href='%23p' transform='rotate(180)'/%3E%3Cuse href='%23p' transform='rotate(240)'/%3E%3Cuse href='%23p' transform='rotate(300)'/%3E%3C/g%3E%3Ccircle r='7' fill='%23F4E3B5'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Lilac">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root { --lilac: #C8A2C8; --lilac-deep: #8E6BA8; --plum: #4A2F5E; --plum-soft: #6E5582; --mist: #F3ECF7; --ivory: #FBF8F4; --line: rgba(74, 47, 94, .16); }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px;
  font: 300 16px/1.5 "Jost", system-ui, sans-serif; color: var(--plum);
  background: radial-gradient(100% 70% at 50% 0%, #EADCF4, rgba(234, 220, 244, 0) 70%), var(--mist);
}
.card {
  width: 100%; max-width: 380px; text-align: center; padding: 44px 30px 34px;
  background: rgba(251, 248, 244, .75); border: 1px solid rgba(255, 255, 255, .9); border-radius: 28px;
  box-shadow: 0 30px 70px -36px rgba(74, 47, 94, .55);
}
svg { width: 96px; height: 96px; display: block; margin: 0 auto 18px; animation: turn 30s linear infinite; }
@keyframes turn { to { transform: rotate(360deg); } }
h1 { font: italic 500 40px/1.05 "Cormorant Garamond", Georgia, serif; margin: 0; }
p { color: var(--plum-soft); margin: 10px 0 26px; }
input[type=password] {
  width: 100%; padding: 15px 16px; border-radius: 14px; border: 1px solid var(--line); background: #fff;
  font: 500 22px/1 "Jost", sans-serif; letter-spacing: .3em; text-align: center; color: var(--plum); outline: none;
}
input[type=password]:focus { border-color: var(--lilac); box-shadow: 0 0 0 4px rgba(200, 162, 200, .28); }
label { display: flex; gap: 8px; align-items: center; justify-content: center; margin: 14px 0 20px; font-size: 14px; color: var(--plum-soft); cursor: pointer; }
input[type=checkbox] { accent-color: var(--lilac-deep); width: 16px; height: 16px; }
button {
  width: 100%; border: 0; border-radius: 14px; padding: 15px; cursor: pointer;
  font: 500 16px/1 "Jost", sans-serif; letter-spacing: .04em; color: #fff;
  background: linear-gradient(135deg, #A47FC0, var(--lilac-deep));
  box-shadow: 0 12px 26px -12px rgba(142, 107, 168, .9);
}
button:disabled { opacity: .6; }
.err { color: #A0546E; min-height: 1.5em; margin: 14px 0 0; font-size: 14px; }
.shake { animation: shake .4s; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@media (prefers-reduced-motion: reduce) { svg, .shake { animation: none; } }
</style>
</head>
<body>
<form class="card" id="f">
  <svg viewBox="-50 -50 100 100" aria-hidden="true">
    <defs><linearGradient id="g" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#8A58A6"/><stop offset=".45" stop-color="#C9A2DB"/><stop offset="1" stop-color="#FCF6FF"/></linearGradient>
    <path id="p" d="M0 -4C-10 -12 -14 -28 -3 -46C-1 -48 1 -48 3 -46C14 -28 10 -12 0 -4Z" fill="url(#g)"/></defs>
    <use href="#p" transform="rotate(60) scale(.9)"/><use href="#p" transform="rotate(180) scale(.9)"/><use href="#p" transform="rotate(300) scale(.9)"/>
    <use href="#p"/><use href="#p" transform="rotate(120)"/><use href="#p" transform="rotate(240)"/>
    <circle r="8" fill="#F6EBC4"/>
  </svg>
  <h1>A little garden</h1>
  <p>Only one person knows the way in.</p>
  <input type="password" id="pw" inputmode="numeric" autocomplete="current-password" aria-label="Password" autofocus>
  <label><input type="checkbox" id="remember" checked> Remember me on this device</label>
  <button type="submit" id="go">Open</button>
  <p class="err" id="err" role="alert"></p>
</form>
<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
(function () {
  var P = JSON.parse(document.getElementById("payload").textContent);
  var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var toB64 = function (buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); };
  var form = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");

  function open(key) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.ct)).then(function (plain) {
      var html = new TextDecoder().decode(plain);
      document.open();
      document.write(html);
      document.close();
    });
  }
  function derive(pw) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    });
  }

  var saved = null;
  try { saved = localStorage.getItem("lilac.key"); } catch (e) {}
  if (saved) {
    crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]).then(open).catch(function () {
      try { localStorage.removeItem("lilac.key"); } catch (e) {}
    });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var pw = document.getElementById("pw").value.trim();
    if (!pw) return;
    go.disabled = true;
    go.textContent = "Opening…";
    err.textContent = "";
    var key;
    derive(pw).then(function (k) {
      key = k;
      return crypto.subtle.exportKey("raw", k);
    }).then(function (raw) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.ct)).then(function () {
        if (document.getElementById("remember").checked) {
          try { localStorage.setItem("lilac.key", toB64(raw)); } catch (e) {}
        }
        return open(key);
      });
    }).catch(function () {
      go.disabled = false;
      go.textContent = "Open";
      err.textContent = "That's not it. Try again?";
      form.classList.remove("shake");
      void form.offsetWidth;
      form.classList.add("shake");
    });
  });
})();
</script>
</body>
</html>
